<!-- Login.html -->
<!DOCTYPE html>
<html>
<head>
  <base target="_top">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PBF Manage - Login</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');
    
    :root {
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #1e293b;
      --text-secondary: #64748b;
      --border: #e2e8f0;
      --error: #ef4444;
      --error-bg: #fef2f2;
      --success: #10b981;
      --success-bg: #ecfdf5;
      --radius: 12px;
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 1rem;
      color: var(--text);
    }
    
    .container {
      background: var(--card-bg);
      border-radius: var(--radius);
      box-shadow: 0 1px 3px 0 rgba(0,0,0,0.1), 0 1px 2px -1px rgba(0,0,0,0.1);
      width: 100%;
      max-width: 400px;
      padding: 2rem;
    }
    
    .logo {
      text-align: center;
      margin-bottom: 1.5rem;
    }
    
    .logo h1 {
      font-size: 1.5rem;
      font-weight: 600;
      color: var(--primary);
    }
    
    .logo p {
      font-size: 0.875rem;
      color: var(--text-secondary);
      margin-top: 0.25rem;
    }
    
    .tabs {
      display: flex;
      gap: 0.5rem;
      margin-bottom: 1.5rem;
      background: #f1f5f9;
      padding: 0.25rem;
      border-radius: 8px;
    }
    
    .tab {
      flex: 1;
      text-align: center;
      padding: 0.5rem 1rem;
      border-radius: 6px;
      font-weight: 500;
      font-size: 0.875rem;
      cursor: pointer;
      transition: all 0.2s;
      border: none;
      background: transparent;
      color: var(--text-secondary);
    }
    
    .tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 1px 2px rgba(0,0,0,0.05);
    }
    
    .form-group {
      margin-bottom: 1rem;
    }
    
    label {
      display: block;
      font-size: 0.875rem;
      font-weight: 500;
      margin-bottom: 0.375rem;
      color: var(--text);
    }
    
    input {
      width: 100%;
      padding: 0.625rem 0.75rem;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.875rem;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: white;
    }
    
    input:focus {
      outline: none;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    
    button[type="submit"] {
      width: 100%;
      padding: 0.75rem;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      transition: background 0.2s;
      margin-top: 0.5rem;
    }
    
    button[type="submit"]:hover {
      background: var(--primary-hover);
    }
    
    button[type="submit"]:disabled {
      opacity: 0.6;
      cursor: not-allowed;
    }
    
    .message {
      font-size: 0.875rem;
      margin-top: 1rem;
      padding: 0.75rem;
      border-radius: 8px;
      display: none;
    }
    
    .message.error {
      background: var(--error-bg);
      color: var(--error);
      display: block;
    }
    
    .message.success {
      background: var(--success-bg);
      color: var(--success);
      display: block;
    }
    
    .hidden {
      display: none;
    }
    
    .spinner {
      display: inline-block;
      width: 1rem;
      height: 1rem;
      border: 2px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: white;
      animation: spin 0.8s linear infinite;
      margin-right: 0.5rem;
    }
    
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    
    .info-box {
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      border-radius: 8px;
      padding: 0.75rem;
      margin-top: 1rem;
      font-size: 0.75rem;
      color: #1e40af;
    }
    
    .info-box a {
      color: #2563eb;
      font-weight: 500;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo">
      <h1>📦 PBF Manage</h1>
      <p>Login atau daftar untuk melanjutkan</p>
    </div>
    
    <div class="tabs">
      <button class="tab active" id="tabLogin">Login</button>
      <button class="tab" id="tabRegister">Daftar</button>
    </div>
    
    <form id="loginForm">
      <div class="form-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="nama@domain.com" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Minimal 6 karakter" required>
      </div>
      <button type="submit" id="loginBtn">
        <span class="btn-text">Login</span>
        <span class="spinner hidden" id="loginSpinner"></span>
      </button>
    </form>
    
    <form id="registerForm" class="hidden">
      <div class="form-group">
        <label for="regEmail">Email</label>
        <input type="email" id="regEmail" name="email" placeholder="nama@domain.com" required>
      </div>
      <div class="form-group">
        <label for="regNamaLengkap">Nama Lengkap</label>
        <input type="text" id="regNamaLengkap" name="namaLengkap" placeholder="Nama Anda" required>
      </div>
      <div class="form-group">
        <label for="regPassword">Password</label>
        <input type="password" id="regPassword" name="password" placeholder="Minimal 6 karakter" required minlength="6">
      </div>
      <button type="submit" id="registerBtn">
        <span class="btn-text">Daftar</span>
        <span class="spinner hidden" id="registerSpinner"></span>
      </button>
    </form>
    
    <div id="message" class="message"></div>
    
    <div class="info-box" id="infoBox">
      💡 Setelah login, Anda akan mendapatkan kode <strong>_e</strong>. Kode ini diperlukan untuk akses API dari AppSheet atau aplikasi lain.
    </div>
  </div>

  <script>
    const SCRIPT_URL = window.location.origin + window.location.pathname;
    
    // Tab switching
    document.getElementById('tabLogin').addEventListener('click', () => switchTab('login'));
    document.getElementById('tabRegister').addEventListener('click', () => switchTab('register'));
    
    function switchTab(tab) {
      document.getElementById('tabLogin').classList.toggle('active', tab === 'login');
      document.getElementById('tabRegister').classList.toggle('active', tab === 'register');
      document.getElementById('loginForm').classList.toggle('hidden', tab !== 'login');
      document.getElementById('registerForm').classList.toggle('hidden', tab !== 'register');
      hideMessage();
    }
    
    function showMessage(text, type) {
      const msg = document.getElementById('message');
      msg.textContent = text;
      msg.className = 'message ' + type;
    }
    
    function hideMessage() {
      document.getElementById('message').className = 'message';
    }
    
    function setLoading(buttonId, spinnerId, loading) {
      document.querySelector(`#${buttonId} .btn-text`).classList.toggle('hidden', loading);
      document.querySelector(`#${buttonId} .spinner`).classList.toggle('hidden', !loading);
      document.getElementById(buttonId).disabled = loading;
    }
    
    // Login
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMessage();
      setLoading('loginBtn', 'loginSpinner', true);
      
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;
      
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'login',
            data: { email, password }
          }),
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          const { user, _e } = result.data;
          // Simpan di localStorage
          localStorage.setItem('pbf_email', user.email);
          localStorage.setItem('pbf__e', _e);
          localStorage.setItem('pbf_user', JSON.stringify(user));
          
          showMessage(`✅ Login berhasil! _e: ${_e}\n\nSimpan kode _e ini untuk akses API.`, 'success');
          document.getElementById('infoBox').innerHTML = 
            `🔑 <strong>_e Anda:</strong> <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">${_e}</code><br>Simpan kode ini! Diperlukan untuk akses API.`;
          
          // Redirect ke spreadsheet setelah 2 detik (opsional)
          setTimeout(() => {
            const sheetUrl = localStorage.getItem('pbf_sheet_url') || 'https://docs.google.com/spreadsheets/';
            window.top.location.href = sheetUrl;
          }, 3000);
        } else {
          showMessage('❌ Login gagal: ' + (result.message || 'Periksa email dan password'), 'error');
        }
      } catch (error) {
        showMessage('❌ Gagal terhubung: ' + error.message, 'error');
      } finally {
        setLoading('loginBtn', 'loginSpinner', false);
      }
    });
    
    // Register
    document.getElementById('registerForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      hideMessage();
      setLoading('registerBtn', 'registerSpinner', true);
      
      const email = document.getElementById('regEmail').value.trim();
      const namaLengkap = document.getElementById('regNamaLengkap').value.trim();
      const password = document.getElementById('regPassword').value;
      
      if (password.length < 6) {
        showMessage('Password minimal 6 karakter', 'error');
        setLoading('registerBtn', 'registerSpinner', false);
        return;
      }
      
      try {
        const response = await fetch(SCRIPT_URL, {
          method: 'POST',
          body: JSON.stringify({
            action: 'register',
            data: { email, password, namaLengkap }
          }),
          headers: { 'Content-Type': 'application/json' }
        });
        const result = await response.json();
        
        if (result.status === 'success') {
          const { user, _e } = result.data;
          localStorage.setItem('pbf_email', user.email);
          localStorage.setItem('pbf__e', _e);
          localStorage.setItem('pbf_user', JSON.stringify(user));
          
          showMessage(`✅ Pendaftaran berhasil! _e: ${_e}`, 'success');
          document.getElementById('infoBox').innerHTML = 
            `🔑 <strong>_e Anda:</strong> <code style="background:#e2e8f0;padding:2px 6px;border-radius:4px;">${_e}</code><br>Simpan kode ini! Diperlukan untuk akses API.`;
          
          // Switch ke tab login? Atau redirect
          setTimeout(() => {
            switchTab('login');
          }, 2000);
        } else {
          showMessage('❌ Gagal mendaftar: ' + (result.message || ''), 'error');
        }
      } catch (error) {
        showMessage('❌ Gagal terhubung: ' + error.message, 'error');
      } finally {
        setLoading('registerBtn', 'registerSpinner', false);
      }
    });
    
    // Prefill URL spreadsheet jika ada parameter
    const urlParams = new URLSearchParams(window.location.search);
    const sheetId = urlParams.get('sheetId');
    if (sheetId) {
      localStorage.setItem('pbf_sheet_url', `https://docs.google.com/spreadsheets/d/${sheetId}`);
    }
  </script>
</body>
</html>
