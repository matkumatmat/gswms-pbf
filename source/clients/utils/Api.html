<script>
var Api = (function() {
  function getCredentials() {
    return {
      email: localStorage.getItem('pbf_email'),
      _e: localStorage.getItem('pbf__e')
    };
  }

  function request(action, data) {
    var cred = getCredentials();
    if (!cred.email || !cred._e) {
      return Promise.reject(new Error('Anda belum login atau _e tidak tersedia.'));
    }

    return new Promise(function(resolve, reject) {
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(function(err) { reject(new Error(err.message)); })
        .callApi(action, cred.email, cred._e, data || {});
    });
  }

  return { request: request };
})();
</script>
